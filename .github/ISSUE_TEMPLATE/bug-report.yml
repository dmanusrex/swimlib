name: Bug report
description: Report incorrect parsing, building, validation, or API behavior.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Swimming files can contain names, birth dates, contact details, medical information, and other sensitive data. Do not attach an unredacted file. Reduce the input to a synthetic example or anonymize it completely.

  - type: dropdown
    id: format
    attributes:
      label: File format or module
      options:
        - SDIF / SD3 / CL2
        - HY3
        - EV3
        - REC
        - STD / ST2
        - Core utilities
        - Packaging or TypeScript declarations
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SwimLib version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: producer
    attributes:
      label: Producing software
      description: If applicable, identify the software and version that created the file.
      placeholder: Hy-Tek Team Manager 8.x

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the operation performed, actual result, and expected result.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide code and the smallest synthetic or fully anonymized input that demonstrates the problem.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Errors and warnings
      description: Include the complete error and the parser warnings array, if available.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Data privacy
      options:
        - label: Any attached or pasted data is synthetic or fully anonymized and contains no personal swimmer information.
          required: true
